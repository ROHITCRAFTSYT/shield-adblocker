name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate blocklist (JSON valid + in sync with source)
        run: npm run lint:json

      - name: Lint JavaScript (eslint)
        run: npm run lint:js

      - name: Unit tests (node --test)
        run: npm test

      - name: Verify rules are committed in built form
        run: |
          npm run build:rules
          git diff --exit-code rules/network-rules.json \
            || (echo "::error::network-rules.json is stale — run 'npm run build:rules' and commit" && exit 1)
