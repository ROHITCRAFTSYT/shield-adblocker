<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shield AdBlocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-state="on">
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>

  <header class="hud">
    <div class="brand">
      <span class="mark">◇</span>
      <span class="word">SHIELD</span>
      <span class="ver" id="ver"></span>
    </div>
    <div class="conn" role="status" aria-live="polite">
      <span class="dot" id="stateDot" aria-hidden="true"></span>
      <span class="conn-txt" id="status">init…</span>
    </div>
  </header>

  <section class="hero reveal" style="--d:1">
    <div class="emblem">
      <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52" />
        <circle class="ring-arc" cx="60" cy="60" r="52" />
        <path class="ring-shield" d="M60 30 L86 41 L86 64 C86 81 60 93 60 93 C60 93 34 81 34 64 L34 41 Z" />
        <path class="ring-check" d="M49 62 L57 70 L73 51" />
      </svg>
    </div>
    <div class="hero-text">
      <div class="state-word" id="stateWord">PROTECTED</div>
      <div class="site" id="site">—</div>
    </div>
  </section>

  <section class="readout reveal" style="--d:2">
    <div class="big-stat">
      <div class="num" id="blockedCount">—</div>
      <div class="cap"><span class="tick">▌</span> blocked · this page</div>
    </div>
    <div class="mini">
      <div class="mini-num" id="ruleCount">—</div>
      <div class="mini-cap">rules<br />armed</div>
    </div>
  </section>

  <section class="controls reveal" style="--d:3">
    <label class="ctl">
      <span class="ctl-meta">
        <span class="ctl-title">Master shield</span>
        <span class="ctl-sub" id="globalSub">Network + cosmetic filtering</span>
      </span>
      <span class="sw">
        <input type="checkbox" id="globalToggle" role="switch" />
        <span class="sw-track"><span class="sw-knob"></span></span>
      </span>
    </label>

    <label class="ctl" id="siteRow">
      <span class="ctl-meta">
        <span class="ctl-title">Allow this site</span>
        <span class="ctl-sub" id="siteSub">Pause blocking on this domain</span>
      </span>
      <span class="sw">
        <input type="checkbox" id="siteToggle" role="switch" />
        <span class="sw-track"><span class="sw-knob"></span></span>
      </span>
    </label>
    <div class="notice" id="reloadNotice" hidden>
      <span class="notice-txt">Reload the page to apply</span>
      <button type="button" class="notice-btn" id="reloadBtn">Reload</button>
    </div>
  </section>

  <footer class="foot reveal" style="--d:4">
    <span class="foot-meta">no telemetry · runs local</span>
    <button type="button" class="foot-link" id="openOptions">settings →</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
