<svg xmlns="http://www.w3.org/2000/svg" width="336" height="430" viewBox="0 0 336 430" font-family="'Cascadia Code','JetBrains Mono','Consolas',ui-monospace,monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#0c1011"/>
      <stop offset="60%" stop-color="#07090a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ff0a3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4ff0a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="336" height="430" fill="url(#bg)"/>
  <ellipse cx="168" cy="40" rx="150" ry="100" fill="url(#halo)"/>

  <!-- header -->
  <g>
    <text x="16" y="34" fill="#4ff0a3" font-size="13" filter="url(#glow)">◇</text>
    <text x="36" y="34" fill="#dfeee6" font-size="12" font-weight="700" letter-spacing="4.2">SHIELD</text>
    <text x="128" y="34" fill="#4b5953" font-size="9" letter-spacing="1.4">v1.0</text>
    <circle cx="262" cy="30" r="3.5" fill="#4ff0a3" filter="url(#glow)"/>
    <text x="320" y="33" fill="#6f8079" font-size="9.5" letter-spacing="1.6" text-anchor="end">ARMED</text>
  </g>
  <line x1="0" y1="56" x2="336" y2="56" stroke="#78968a" stroke-opacity="0.14"/>

  <!-- hero -->
  <g>
    <!-- emblem -->
    <circle cx="58" cy="118" r="34" fill="none" stroke="#78968a" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M58 84 A34 34 0 0 1 89.95 106.37" fill="none" stroke="#4ff0a3" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    <g transform="translate(-2,57)" filter="url(#glow)">
      <path d="M60 30 L86 41 L86 64 C86 81 60 93 60 93 C60 93 34 81 34 64 L34 41 Z" fill="#4ff0a3" fill-opacity="0.16" stroke="#4ff0a3" stroke-width="2" stroke-linejoin="round"/>
      <path d="M49 62 L57 70 L73 51" fill="none" stroke="#4ff0a3" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- text -->
    <text x="106" y="114" fill="#dfeee6" font-size="21" font-weight="700" letter-spacing="0.6">PROTECTED</text>
    <text x="106" y="136" fill="#6f8079" font-size="11" letter-spacing="0.3">nytimes.com</text>
  </g>

  <!-- readout panel -->
  <g>
    <rect x="16" y="180" width="304" height="84" rx="12" fill="#ffffff" fill-opacity="0.022" stroke="#78968a" stroke-opacity="0.14"/>
    <text x="30" y="232" fill="#4ff0a3" font-size="42" font-weight="700" filter="url(#glow)">37</text>
    <text x="30" y="252" fill="#6f8079" font-size="9.5" letter-spacing="1.1"><tspan fill="#4ff0a3">▌</tspan> BLOCKED · THIS PAGE</text>
    <line x1="250" y1="196" x2="250" y2="248" stroke="#78968a" stroke-opacity="0.14"/>
    <text x="285" y="220" fill="#dfeee6" font-size="19" font-weight="700" text-anchor="middle">189</text>
    <text x="285" y="236" fill="#4b5953" font-size="9" letter-spacing="1.3" text-anchor="middle">RULES</text>
    <text x="285" y="247" fill="#4b5953" font-size="9" letter-spacing="1.3" text-anchor="middle">ARMED</text>
  </g>

  <!-- control: master shield (ON) -->
  <g>
    <rect x="16" y="276" width="304" height="46" rx="11" fill="#ffffff" fill-opacity="0.025" stroke="#78968a" stroke-opacity="0.14"/>
    <text x="30" y="300" fill="#dfeee6" font-size="12.5" font-weight="600">Master shield</text>
    <text x="30" y="314" fill="#6f8079" font-size="9.5" letter-spacing="0.8">NETWORK + COSMETIC FILTERING</text>
    <rect x="260" y="287" width="46" height="24" rx="7" fill="#4ff0a3" fill-opacity="0.16" stroke="#4ff0a3"/>
    <rect x="284" y="289" width="18" height="18" rx="5" fill="#4ff0a3" filter="url(#glow)"/>
  </g>

  <!-- control: allow this site (OFF) -->
  <g>
    <rect x="16" y="330" width="304" height="46" rx="11" fill="#ffffff" fill-opacity="0.025" stroke="#78968a" stroke-opacity="0.14"/>
    <text x="30" y="354" fill="#dfeee6" font-size="12.5" font-weight="600">Allow this site</text>
    <text x="30" y="368" fill="#6f8079" font-size="9.5" letter-spacing="0.8">PAUSE BLOCKING ON THIS DOMAIN</text>
    <rect x="260" y="341" width="46" height="24" rx="7" fill="#161b1a" stroke="#78968a" stroke-opacity="0.14"/>
    <rect x="262" y="343" width="18" height="18" rx="5" fill="#4a544f"/>
  </g>

  <!-- footer -->
  <line x1="16" y1="392" x2="320" y2="392" stroke="#78968a" stroke-opacity="0.14"/>
  <text x="16" y="412" fill="#4b5953" font-size="9" letter-spacing="2">SHIELD ADBLOCKER</text>
  <text x="320" y="412" fill="#4b5953" font-size="9" letter-spacing="1" text-anchor="end">no telemetry · runs local</text>
</svg>
